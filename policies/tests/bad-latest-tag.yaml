# Non conforme : tag latest -> doit etre rejete par Gatekeeper
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-latest
  namespace: tp2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bad-latest
  template:
    metadata:
      labels:
        app: bad-latest
    spec:
      containers:
        - name: web
          image: nginx:latest
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
