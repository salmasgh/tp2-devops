[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=lcov:coverage.lcov --cov-fail-under=85"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["app"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
