# OpenTelemetry Collector (DaemonSet)
#  - recoit les traces OTLP de l'application -> Tempo
#  - collecte les logs JSON des conteneurs (filelog) -> Loki (OTLP)
mode: daemonset
image:
  repository: otel/opentelemetry-collector-contrib
presets:
  logsCollection:
    enabled: true
    includeCollectorLogs: false
  kubernetesAttributes:
    enabled: true
config:
  receivers:
    file_log:
      include:
        - /var/log/pods/tp2_*/*/*.log
  processors:
    batch: {}
    resource/logs:
      attributes:
        - key: service.name
          from_attribute: k8s.deployment.name
          action: insert
    transform/trace_id:
      log_statements:
        - context: log
          statements:
            - merge_maps(cache, ParseJSON(body), "upsert") where IsMatch(body, "^\\{")
            - set(attributes["trace_id"], cache["trace_id"]) where cache["trace_id"] != nil
            - set(attributes["level"], cache["level"]) where cache["level"] != nil
            - set(severity_text, cache["level"]) where cache["level"] != nil
  exporters:
    otlp_grpc/tempo:
      endpoint: tempo.monitoring.svc:4317
      tls:
        insecure: true
    otlp_http/loki:
      endpoint: http://loki.monitoring.svc:3100/otlp
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp_grpc/tempo]
      logs:
        receivers: [file_log]
        processors: [memory_limiter, k8s_attributes, resource/logs, transform/trace_id, batch]
        exporters: [otlp_http/loki]
      metrics: null
ports:
  otlp:
    enabled: true
  otlp-http:
    enabled: true
  jaeger-compact: { enabled: false }
  jaeger-thrift: { enabled: false }
  jaeger-grpc: { enabled: false }
  zipkin: { enabled: false }
service:
  enabled: true
